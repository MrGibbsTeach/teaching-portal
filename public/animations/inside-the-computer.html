<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside the Computer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;600&display=swap">
<style>
:root {
  --bg: #e9ece9;
  --ink: #16213f;
  --muted: #55607e;
  --blue: #2146c7;
  --orange: #ff7a1a;
  --glass: rgba(255, 255, 255, 0.66);
  --edge: rgba(255, 255, 255, 0.9);
  --line: rgba(22, 33, 63, 0.12);
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#c { position: fixed; inset: 0; display: block; background: var(--bg); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl {
  position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
  padding: 6px 12px; border-radius: 999px; background: var(--glass); color: var(--ink);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--edge);
  box-shadow: 0 6px 18px rgba(22, 33, 63, 0.14); will-change: transform;
  transition: background-color 0.25s, color 0.25s;
}
.lbl b { font: 800 14px/1 var(--display); letter-spacing: 0.01em; }
.lbl small { font: 600 11px/1 var(--body); color: var(--muted); }
.lbl.on { background: var(--orange); color: #fff; }
.lbl.on small { color: rgba(255, 255, 255, 0.9); }
.tagp {
  position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
  padding: 4px 10px; border-radius: 8px; background: rgba(22, 33, 63, 0.88); color: #fff;
  box-shadow: 0 4px 12px rgba(22, 33, 63, 0.25); will-change: transform; transition: opacity 0.25s;
}
.tagp b { font: 800 12px/1 var(--display); }
.tagp small { font: 600 11px/1 var(--body); color: rgba(255, 255, 255, 0.75); }
.card {
  position: fixed; background: var(--glass); border: 1px solid var(--edge); border-radius: 20px;
  backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: 0 14px 40px rgba(22, 33, 63, 0.16);
}
.top { left: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 12px 18px; }
.top h1 { margin: 0; font: 800 22px/1.1 var(--display); letter-spacing: -0.01em; }
.top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
.bottom {
  left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(760px, calc(100% - 32px)); box-sizing: border-box; padding: 14px 18px 16px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#tag { font: 800 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
#cap { margin: 6px 0 12px; font-size: 17px; line-height: 1.35; font-weight: 600; min-height: 2.7em; text-wrap: balance; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: 12px; }
#fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--blue); }
#ticks i { position: absolute; top: -3px; width: 2px; height: 12px; background: rgba(255, 255, 255, 0.95); border-radius: 1px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
button {
  font: 700 13px/1 var(--body); color: var(--ink); background: rgba(255, 255, 255, 0.8);
  border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer;
}
button:hover { background: #fff; }
button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
#speed { min-width: 118px; }
#play { background: var(--ink); border-color: var(--ink); color: #fff; min-width: 76px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
@media (max-width: 640px) {
  .lbl small, .tagp small { display: none; }
  .lbl { padding: 5px 9px; }
  .lbl b { font-size: 12px; }
  .top h1 { font-size: 18px; }
  .top p { display: none; }
  #cap { font-size: 15px; }
  .hint { display: none; }
}

/* Embedded in a lesson: the lesson supplies the title, so drop the title card and hint */
.embed .top, .embed .hint { display: none; }
.embed .bottom { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px 12px; }
.embed #cap { font-size: 15px; margin: 4px 0 8px; min-height: 2.6em; }
.embed .bar { margin-bottom: 8px; }

/* Compact controls when embedded in a lesson frame */
.embed .bottom { left: 8px; right: 8px; width: auto; transform: none; bottom: 8px; padding: 8px 10px 10px; border-radius: 14px; }
.embed #cap { font-size: 14px; line-height: 1.3; margin: 3px 0 6px; min-height: 0; }
.embed #tag { font-size: 10px; }
.embed .bar { height: 4px; margin-bottom: 7px; }
.embed .controls { flex-wrap: nowrap; gap: 6px; }
.embed #chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.embed #chips::-webkit-scrollbar { display: none; }
.embed button { padding: 7px 10px; font-size: 12px; flex-shrink: 0; }
.embed #play, .embed #speed { min-width: 0; }
</style>
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed");</script>
</head><body><canvas id="c" aria-label="Animated 3D computer showing input, storage, memory, processing and output"></canvas>
<div id="labels"></div>

<div class="card bottom">

  <p id="cap">One keypress, five jobs. Watch where the data goes.</p>
  <div class="bar"><div id="fill"></div><div id="ticks"></div></div>
  <div class="controls"><div id="chips"></div><button id="play" type="button">Pause</button><button id="speed" type="button">Speed: Slow</button></div>
  <div class="hint">Tap a stage to jump to it. Use Speed to slow it down further. Space or a tap on the scene pauses. Keys 1 to 5 also jump.</div>
</div>
