<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-labelledby="cs-title cs-desc">
  <title id="cs-title">Client-Server Network Architecture Diagram</title>
  <desc id="cs-desc">Diagram showing a client-server network architecture. A dedicated central server manages files, user security, and shared services for client computers and devices connected through a switch.</desc>
  
  <!-- Background Card -->
  <rect width="800" height="500" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header Block -->
  <text x="50" y="46" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2A44">Client-Server Network</text>
  <text x="50" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">Dedicated central server manages data storage, user permissions, and services for clients</text>
  
  <rect x="620" y="26" width="130" height="32" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="685" y="47" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0284C7">SCSA GENERAL</text>

  <!-- Network Switch Backbone -->
  <g transform="translate(400, 260)">
    <rect x="-65" y="-18" width="130" height="36" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="-50" y="-6" width="15" height="12" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <rect x="-25" y="-6" width="15" height="12" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <rect x="0" y="-6" width="15" height="12" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <rect x="25" y="-6" width="15" height="12" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">Network Switch</text>
  </g>

  <!-- Links from Switch to Server and Clients -->
  <g stroke="#1F2A44" stroke-width="2.5" stroke-linecap="round">
    <!-- Server link (top) -->
    <line x1="400" y1="242" x2="400" y2="195"/>
    <!-- Client 1: Desktop PC (bottom left) -->
    <line x1="360" y1="278" x2="135" y2="350"/>
    <!-- Client 2: Laptop (bottom mid-left) -->
    <line x1="385" y1="278" x2="310" y2="350"/>
    <!-- Client 3: Smartphone (bottom mid-right) -->
    <line x1="415" y1="278" x2="490" y2="350"/>
    <!-- Client 4: Shared Printer (bottom right) -->
    <line x1="440" y1="278" x2="665" y2="350"/>
  </g>

  <!-- Flow Indicators (Request / Response) -->
  <g transform="translate(420, 218)">
    <path d="M 0 -12 L 0 12" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <polygon points="0,-15 -3,-9 3,-9" fill="#0284C7"/>
    <polygon points="0,15 -3,9 3,9" fill="#0284C7"/>
  </g>

  <!-- Central Server (Top Center) -->
  <g transform="translate(400, 145)">
    <rect x="-42" y="-40" width="84" height="74" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="-32" y="-30" width="64" height="14" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="22" cy="-23" r="2.5" fill="#0284C7"/>
    <rect x="-32" y="-11" width="64" height="14" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="22" cy="-4" r="2.5" fill="#0284C7"/>
    <rect x="-32" y="8" width="64" height="14" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="22" cy="15" r="2.5" fill="#0284C7"/>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A44">Central Server</text>
    <text x="0" y="72" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0284C7">Files, security and backup</text>
  </g>

  <!-- Client 1: Desktop PC -->
  <g transform="translate(135, 360)">
    <rect x="-30" y="-30" width="60" height="38" rx="4" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="-25" y="-25" width="50" height="28" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="-4" y="8" width="8" height="8" fill="#1F2A44"/>
    <rect x="-15" y="16" width="30" height="3" rx="1.5" fill="#1F2A44"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A44">Desktop PC</text>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569">Client</text>
  </g>

  <!-- Client 2: Laptop -->
  <g transform="translate(310, 360)">
    <rect x="-28" y="-28" width="56" height="34" rx="4" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="-23" y="-23" width="46" height="24" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M -35 6 L 35 6 L 30 15 L -30 15 Z" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A44">Laptop</text>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569">Client</text>
  </g>

  <!-- Client 3: Smartphone -->
  <g transform="translate(490, 360)">
    <rect x="-16" y="-30" width="32" height="54" rx="6" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="-12" y="-23" width="24" height="40" rx="2" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="0" cy="-26" r="1.5" fill="#1F2A44"/>
    <line x1="-5" y1="20" x2="5" y2="20" stroke="#1F2A44" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A44">Smartphone</text>
    <text x="0" y="62" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569">Client</text>
  </g>

  <!-- Client 4: Shared Printer -->
  <g transform="translate(665, 360)">
    <rect x="-20" y="-26" width="40" height="14" rx="2" fill="#F1F5F9" stroke="#1F2A44" stroke-width="1.5"/>
    <rect x="-16" y="-31" width="32" height="12" rx="1" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.5"/>
    <rect x="-30" y="-12" width="60" height="28" rx="4" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
    <rect x="-18" y="0" width="36" height="4" rx="1" fill="#1F2A44"/>
    <circle cx="20" cy="0" r="2.5" fill="#0284C7"/>
    <text x="0" y="38" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2A44">Printer</text>
    <text x="0" y="58" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569">Shared resource</text>
  </g>

  <!-- Bottom Educational Summary -->
  <rect x="50" y="442" width="700" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="466" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2A44">Control: Centralised management allows strong security, access permissions, and single-point backups.</text>
</svg>